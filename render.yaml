services:
  - type: web
    name: spacez-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # you will paste this in the Render dashboard
      - key: FRONTEND_URL
        sync: false        # paste your Vercel URL here after deploying frontend
    plan: free
